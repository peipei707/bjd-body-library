<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJD / MJD 身体参考图库</title>
<style>
  :root {
    --bg: #faf7f4;
    --card: #ffffff;
    --ink: #2b2320;
    --ink-2: #6b5d55;
    --line: #e8ddd4;
    --accent: #b0526b;
    --accent-soft: #f6e3e8;
    --chip: #f1e9e2;
    --chip-on: #b0526b;
    --shadow: 0 1px 3px rgba(60,40,30,.08), 0 6px 20px rgba(60,40,30,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1816;
      --card: #262120;
      --ink: #ece4de;
      --ink-2: #a99a90;
      --line: #3a322e;
      --accent: #d98aa0;
      --accent-soft: #3d2a30;
      --chip: #322b28;
      --chip-on: #d98aa0;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    line-height: 1.55;
  }
  a { color: var(--accent); }

  header { padding: 34px 20px 10px; max-width: 1280px; margin: 0 auto; }
  header h1 { font-size: 26px; letter-spacing: .04em; }
  header h1 small { font-weight: 400; color: var(--ink-2); font-size: 14px; margin-left: 10px; }
  .stats { color: var(--ink-2); font-size: 13px; margin-top: 6px; }
  #quicknav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #quicknav .chip small { opacity: .65; margin-left: 3px; }

  .panel {
    max-width: 1280px; margin: 14px auto 0; padding: 14px 20px 16px;
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .frow { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 8px; }
  .frow:last-child { margin-bottom: 0; }
  .flabel { font-size: 12px; color: var(--ink-2); min-width: 3em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 999px; padding: 3px 12px; font-size: 12.5px; cursor: pointer;
    transition: .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--chip-on); border-color: var(--chip-on); color: #fff; }
  select, input[type=search] {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 5px 10px; font-size: 13px;
  }
  input[type=search] { width: 220px; }
  .count-note { font-size: 12px; color: var(--ink-2); margin-left: auto; }
  #f-toggle { display: none; }
  #f-toggle.on { background: var(--chip-on); border-color: var(--chip-on); color: #fff; }

  main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 60px; }
  .group-title {
    margin: 26px 0 4px; font-size: 18px; display: flex; align-items: baseline; gap: 10px;
    scroll-margin-top: 150px;
  }
  .group-title small { color: var(--ink-2); font-size: 12.5px; font-weight: 400; }
  .group-count { font-size: 12px; color: var(--accent); }
  .grid {
    display: grid; gap: 16px; margin-top: 10px;
    grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: transform .18s, box-shadow .18s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(60,40,30,.12), 0 12px 32px rgba(60,40,30,.12); }
  @media (prefers-reduced-motion: reduce) { .card, .card:hover { transition: none; transform: none; } }
  .star {
    position: absolute; top: 6px; right: 6px; z-index: 2; border: none; cursor: pointer;
    font-size: 17px; line-height: 1; padding: 4px 6px; border-radius: 8px;
    background: rgba(255,255,255,.75); color: #b78e2c;
  }
  .star:not(.on) { color: #a99a90; }
  #brand-info {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin: 16px 0 4px; box-shadow: var(--shadow);
  }
  #brand-info h2 { font-size: 17px; margin-bottom: 4px; }
  #brand-info h2 small { font-weight: 400; color: var(--ink-2); font-size: 12.5px; margin-left: 8px; }
  #brand-info p { font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
  .relrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
  .relrow .chip { font-size: 12px; }
  .relnote { color: var(--ink-2); margin-right: 6px; }
  .imgbox { position: relative; aspect-ratio: 3/4; background: linear-gradient(160deg, var(--chip), var(--bg)); cursor: zoom-in; }
  .imgbox img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .imgbox .noimg {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px;
    align-items: center; justify-content: center; color: var(--ink-2); font-size: 12.5px;
  }
  .noimg .glyph { font-size: 34px; opacity: .55; }
  .typetag {
    position: absolute; top: 8px; left: 8px; font-size: 11px; padding: 2px 8px;
    border-radius: 6px; color: #fff; background: #8a6da8;
  }
  .typetag.bjd { background: #b0526b; }
  .typetag.mjd { background: #4f7fa8; }
  .imgcount {
    position: absolute; right: 8px; bottom: 8px; font-size: 11px; padding: 2px 8px;
    border-radius: 6px; color: #fff; background: rgba(20,12,10,.55);
  }
  .cbody { padding: 9px 12px 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .brandline { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
  .brandline b { color: var(--accent); font-weight: 600; cursor: pointer; }
  .brandline b:hover { text-decoration: underline; }
  .cname { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .cname small { display: block; font-weight: 400; font-size: 11px; color: var(--ink-2); margin-top: 1px; }
  .spec { font-size: 12px; color: var(--ink-2); }
  .spec b { color: var(--ink); font-weight: 600; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 4px; }
  .stag { font-size: 10.5px; padding: 1px 7px; border-radius: 5px; background: var(--chip); color: var(--ink-2); }
  .stag.bust { background: var(--accent-soft); color: var(--accent); }
  .notes { font-size: 11.5px; color: var(--ink-2); }
  .srcline { margin-top: auto; padding-top: 7px; }
  .srcline a {
    font-size: 12px; text-decoration: none; border: 1px solid var(--line);
    padding: 3px 10px; border-radius: 8px; display: inline-block;
  }
  .srcline a:hover { border-color: var(--accent); background: var(--accent-soft); }
  .empty { text-align: center; color: var(--ink-2); padding: 80px 0; }

  #lightbox {
    position: fixed; inset: 0; background: rgba(20,12,10,.9); z-index: 99;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
  }
  #lightbox.show { display: flex; }
  #lb-img { max-width: 94vw; max-height: 70vh; border-radius: 8px; background: #fff; }
  #lb-top { color: #f0e8e2; font-size: 14px; text-align: center; padding: 0 56px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #lb-top a { color: #f2b8c8; }
  #lb-thumbs { display: flex; gap: 8px; overflow-x: auto; max-width: 94vw; padding: 4px 8px; }
  #lb-thumbs img {
    height: 62px; width: auto; border-radius: 6px; border: 2px solid transparent;
    cursor: pointer; background: #fff; flex: none;
  }
  #lb-thumbs img.on { border-color: var(--accent); }
  .lb-btn {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 100;
    font-size: 30px; line-height: 1; color: #fff; background: rgba(255,255,255,.14);
    border: none; border-radius: 10px; padding: 12px 14px; cursor: pointer;
  }
  .lb-btn:hover { background: rgba(255,255,255,.28); }
  #lb-prev { left: 12px; }
  #lb-next { right: 12px; }

  footer { max-width: 1280px; margin: 0 auto; padding: 20px; color: var(--ink-2); font-size: 12px; border-top: 1px solid var(--line); }

  /* 手机端:筛选面板默认收起为一行,卡片双列紧凑 */
  @media (max-width: 700px) {
    header { padding: 18px 14px 6px; }
    header h1 { font-size: 19px; }
    header h1 small { display: block; margin-left: 0; margin-top: 2px; font-size: 11.5px; }
    .stats { font-size: 11.5px; }
    .panel { padding: 8px 12px; }
    #f-toggle { display: inline-block; flex: none; }
    .frow.bar { flex-wrap: nowrap; margin-bottom: 0; }
    .frow.bar input[type=search] { flex: 1; width: auto; min-width: 0; font-size: 16px; padding: 4px 10px; }
    .frow.bar .count-note { flex: none; }
    #adv { display: none; }
    .panel.open #adv { display: block; margin-top: 10px; max-height: 52vh; overflow-y: auto; }
    #adv .frow { margin-bottom: 10px; }
    main { padding: 10px 12px 44px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .group-title { margin: 18px 0 2px; font-size: 16px; }
    .cbody { padding: 7px 9px 10px; gap: 4px; }
    .cname { font-size: 13px; }
    .spec { font-size: 11px; }
    .notes { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    footer { padding: 16px 14px; font-size: 11px; }
  }
</style>
</head>
<body>
<header>
  <h1>BJD / MJD 身体参考图库 <small>树脂球关节 &amp; 胶皮机械关节 · 素体资料索引</small></h1>
  <div class="stats" id="stats">加载中…</div>
  <div id="quicknav"></div>
</header>

<div class="panel" id="panel">
  <div class="frow bar">
    <button id="f-toggle" class="chip">筛选 ▾</button>
    <input type="search" id="f-q" placeholder="搜索名称 / 品牌 / 备注…">
    <button id="f-fav" class="chip" title="只看收藏">★ 收藏</button>
    <span class="count-note" id="count-note"></span>
  </div>
  <div id="adv">
    <div class="frow">
      <span class="flabel">类型</span><div class="chips" id="f-type"></div>
      <span class="flabel" style="margin-left:10px">性别</span><div class="chips" id="f-gender"></div>
    </div>
    <div class="frow">
      <span class="flabel">尺寸</span><div class="chips" id="f-size"></div>
    </div>
    <div class="frow">
      <span class="flabel">风格</span><div class="chips" id="f-style"></div>
    </div>
    <div class="frow">
      <span class="flabel">品牌</span>
      <select id="f-brand"><option value="">全部品牌</option></select>
    </div>
  </div>
</div>

<main id="main"></main>

<div id="lightbox">
  <button class="lb-btn" id="lb-prev" aria-label="上一张">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-btn" id="lb-next" aria-label="下一张">›</button>
  <div id="lb-top"><span id="lb-cap"></span><a id="lb-src" target="_blank" rel="noopener noreferrer">来源页 ↗</a></div>
  <div id="lb-thumbs"></div>
</div>

<footer>
  图片与商品信息版权均归各品牌方所有,本页仅作个人参考索引,图片直接引用自「来源」链接所示页面;若图片未显示,请点击卡片上的来源链接查看官方页面。<br>
  数据人工整理,规格以品牌官方页面为准。补充新身体:编辑 <code>data/raw/*.json</code> 后运行 <code>python3 scripts/build.py</code>。
</footer>

<script src="data/bodies.js"></script>
<script>
const DATA = (window.BJD_BODIES || []).slice();
const SIZE_ORDER = ["叔叔体","三分","大四分","四分","六分","八分","十二分","其他"];
const SIZE_DESC = {
  "叔叔体":"约 68cm 及以上","三分":"1/3 · 约 55–67cm","大四分":"约 48–54cm",
  "四分":"1/4 · 约 38–47cm","六分":"1/6 · 约 24–33cm","八分":"1/8 · 约 15–23cm",
  "十二分":"1/12 · 约 10–14cm","其他":"特殊规格"
};
const GENDER_CN = { male:"男", female:"女", neutral:"中性" };
const BRANDS = window.BJD_BRANDS || {};
const COUNTRY_CN = { JP:"日本", KR:"韩国", CN:"中国", RU:"俄罗斯", FR:"法国", SE:"瑞典", US:"美国", ES:"西班牙" };

const state = { type:"", gender:"", size:"", styles:new Set(), brand:"", q:"", fav:false };
let favs = new Set(JSON.parse(localStorage.getItem("bjd-favs") || "[]"));
const saveFavs = () => localStorage.setItem("bjd-favs", JSON.stringify([...favs]));

function readHash() {
  try {
    const p = new URLSearchParams(location.hash.slice(1));
    state.type = p.get("t") || "";
    state.gender = p.get("g") || "";
    state.size = p.get("s") || "";
    state.brand = p.get("b") || "";
    state.q = p.get("q") || "";
    state.fav = p.get("f") === "1";
    state.styles = new Set((p.get("st") || "").split(",").filter(Boolean));
  } catch (e) {}
}
function writeHash() {
  const p = new URLSearchParams();
  if (state.type) p.set("t", state.type);
  if (state.gender) p.set("g", state.gender);
  if (state.size) p.set("s", state.size);
  if (state.styles.size) p.set("st", [...state.styles].join(","));
  if (state.brand) p.set("b", state.brand);
  if (state.q) p.set("q", state.q);
  if (state.fav) p.set("f", "1");
  history.replaceState(null, "", p.toString() ? "#" + p.toString() : location.pathname);
}

function chipbar(el, items, get, set, allLabel) {
  const box = document.getElementById(el);
  const mk = (val, label) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    b.onclick = () => { set(val, b); render(); };
    box.appendChild(b); return b;
  };
  box._buttons = [];
  if (allLabel !== null) box._buttons.push([mk("", allLabel || "全部"), ""]);
  items.forEach(v => box._buttons.push([mk(v, v), v]));
  box._sync = () => box._buttons.forEach(([b, v]) => b.classList.toggle("on", get(v)));
  box._sync();
}

function init() {
  chipbar("f-type", ["BJD","MJD"], v => (state.type||"")===v, v => state.type = v);
  chipbar("f-gender", ["male","female","neutral"].map(g=>GENDER_CN[g]), v =>
    v ? GENDER_CN[state.gender] === v : state.gender === ""
  , v => {
    state.gender = v ? Object.keys(GENDER_CN).find(k=>GENDER_CN[k]===v) : "";
  });
  chipbar("f-size", SIZE_ORDER, v => state.size===v, v => state.size = v);
  const styleSet = [...new Set(DATA.flatMap(d => d.styles||[]))].sort((a,b)=>a.localeCompare(b,"zh"));
  chipbar("f-style", styleSet, v => v ? state.styles.has(v) : state.styles.size===0, v => {
    if (!v) state.styles.clear();
    else state.styles.has(v) ? state.styles.delete(v) : state.styles.add(v);
  });
  const brands = [...new Set(DATA.map(d => d.brand))].sort();
  const sel = document.getElementById("f-brand");
  brands.forEach(b => {
    const d = DATA.find(x=>x.brand===b);
    const o = document.createElement("option");
    o.value = b;
    o.textContent = d.brand_cn && d.brand_cn !== b ? `${b} · ${d.brand_cn}` : b;
    sel.appendChild(o);
  });
  sel.onchange = () => { state.brand = sel.value; render(); };
  document.getElementById("f-q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
  document.getElementById("f-toggle").onclick = () =>
    document.getElementById("panel").classList.toggle("open");
  document.getElementById("f-fav").onclick = () => { state.fav = !state.fav; render(); };
  readHash();
  document.getElementById("f-q").value = state.q;
  sel.value = state.brand;

  const nImg = DATA.reduce((n,d)=>n+(d.views||[]).length,0);
  document.getElementById("stats").textContent =
    `共收录 ${DATA.length} 款身体 · ${brands.length} 个品牌 · ${nImg} 张已核验参考图 · 按尺寸 / 性别 / 风格 / 品牌检索`;
  render();
}

function setBrand(b) {
  state.brand = b;
  document.getElementById("f-brand").value = b;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function match(d) {
  if (state.fav && !favs.has(d.id)) return false;
  if (state.type && d.type !== state.type) return false;
  if (state.gender && d.gender !== state.gender) return false;
  if (state.size && d.size_class !== state.size) return false;
  if (state.brand && d.brand !== state.brand) return false;
  if (state.styles.size && ![...state.styles].every(s => (d.styles||[]).includes(s))) return false;
  if (state.q) {
    const hay = [d.brand,d.brand_cn,d.name,d.name_cn,d.notes,(d.styles||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

function card(d) {
  const el = document.createElement("div");
  el.className = "card";
  const vs = d.views || [];
  const img = vs.length ? `
    <img src="${esc(vs[0].url)}" alt="${esc(d.name)}" loading="lazy" referrerpolicy="no-referrer"
         onerror="this.style.display='none';this.parentNode.querySelector('.noimg').style.display='flex'">
    <div class="noimg" style="display:none"><span class="glyph">🩰</span>图片加载失败<br>请点下方「来源」查看</div>
    ${vs.length > 1 ? `<span class="imgcount">${vs.length} 图</span>` : ""}`
    : `<div class="noimg"><span class="glyph">🩰</span>暂无直链图 · 见来源页</div>`;
  const spec = [
    d.height_cm ? `<b>${d.height_cm}cm</b>` : null,
    d.scale ? esc(d.scale) : null,
    GENDER_CN[d.gender] || null,
    d.material ? esc(d.material) : null
  ].filter(Boolean).join(" · ");
  el.innerHTML = `
    <div class="imgbox">${img}<span class="typetag ${d.type==="BJD"?"bjd":"mjd"}">${esc(d.type)}</span>
      <button class="star ${favs.has(d.id)?"on":""}" title="收藏">${favs.has(d.id)?"★":"☆"}</button></div>
    <div class="cbody">
      <div class="brandline"><b title="看这个品牌的全部身体">${esc(d.brand)}</b>${d.brand_cn && d.brand_cn!==d.brand ? esc(d.brand_cn) : ""}<span>· ${esc(d.country||"")}</span></div>
      <div class="cname">${esc(d.name_cn || d.name)}<small>${esc(d.name || "")}</small></div>
      <div class="spec">${spec}</div>
      <div class="tagrow">${(d.styles||[]).map(s=>`<span class="stag">${esc(s)}</span>`).join("")}
        ${(d.bust_options||[]).length ? `<span class="stag bust">胸围 ${d.bust_options.length} 选</span>` : ""}</div>
      ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ""}
      <div class="srcline"><a href="${esc(d.source?.url||"#")}" target="_blank" rel="noopener noreferrer">来源:${esc(d.source?.site||"官方页面")} ↗</a></div>
    </div>`;
  if (vs.length) el.querySelector(".imgbox").onclick = () => openLightbox(d, 0);
  el.querySelector(".star").onclick = e => {
    e.stopPropagation();
    favs.has(d.id) ? favs.delete(d.id) : favs.add(d.id);
    saveFavs();
    const b = e.currentTarget;
    b.classList.toggle("on", favs.has(d.id));
    b.textContent = favs.has(d.id) ? "★" : "☆";
    syncFavBtn();
    if (state.fav) render();
  };
  el.querySelector(".brandline b").onclick = () => setBrand(d.brand);
  return el;
}

function syncFavBtn() {
  const b = document.getElementById("f-fav");
  b.textContent = favs.size ? `★ 收藏 ${favs.size}` : "★ 收藏";
  b.classList.toggle("on", state.fav);
}

function renderBrandInfo(container) {
  if (!state.brand) return;
  const info = BRANDS[state.brand];
  const sample = DATA.find(x => x.brand === state.brand) || {};
  const box = document.createElement("div");
  box.id = "brand-info";
  const cn = info?.cn && info.cn !== state.brand ? info.cn : (sample.brand_cn !== state.brand ? sample.brand_cn : "");
  const country = COUNTRY_CN[info?.country || sample.country] || "";
  const rels = (info?.rel || []).filter(([b]) => DATA.some(x => x.brand === b));
  box.innerHTML = `
    <h2>${esc(state.brand)}<small>${esc(cn || "")}${country ? " · " + country : ""}</small></h2>
    ${info?.blurb ? `<p>${esc(info.blurb)}</p>` : ""}
    <div class="relrow">
      ${rels.length ? `<span class="relnote">相关品牌:</span>` : ""}
      ${rels.map(([b, note]) => `<button class="chip" data-b="${esc(b)}" title="${esc(note)}">${esc(b)}</button>`).join("")}
      ${info?.site ? `<a href="${esc(info.site)}" target="_blank" rel="noopener noreferrer" style="margin-left:auto;font-size:12px">官网 ↗</a>` : ""}
    </div>`;
  box.querySelectorAll("[data-b]").forEach(x => x.onclick = () => setBrand(x.dataset.b));
  container.appendChild(box);
}

function renderQuicknav(hits) {
  const nav = document.getElementById("quicknav");
  nav.innerHTML = "";
  for (const sc of SIZE_ORDER) {
    const n = hits.filter(d => d.size_class === sc).length;
    if (!n) continue;
    const b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = `${sc}<small>${n}</small>`;
    b.onclick = () => document.getElementById("g-" + sc)?.scrollIntoView({ behavior: "smooth", block: "start" });
    nav.appendChild(b);
  }
}

function render() {
  document.querySelectorAll(".panel .chips").forEach(c => c._sync && c._sync());
  const main = document.getElementById("main");
  main.innerHTML = "";
  const hits = DATA.filter(match);
  document.getElementById("count-note").textContent = `显示 ${hits.length} / ${DATA.length}`;
  const nOn = (state.type?1:0)+(state.gender?1:0)+(state.size?1:0)+state.styles.size+(state.brand?1:0)+(state.fav?1:0);
  const fbtn = document.getElementById("f-toggle");
  fbtn.textContent = nOn ? `筛选 · ${nOn}` : "筛选 ▾";
  fbtn.classList.toggle("on", nOn > 0);
  syncFavBtn();
  writeHash();
  renderQuicknav(hits);
  renderBrandInfo(main);
  if (!hits.length) { main.innerHTML += `<div class="empty">没有符合筛选的身体,试试放宽条件。</div>`; return; }
  for (const sc of SIZE_ORDER) {
    const group = hits.filter(d => d.size_class === sc);
    if (!group.length) continue;
    group.sort((a,b) => a.brand.localeCompare(b.brand) || (b.height_cm||0)-(a.height_cm||0));
    const h = document.createElement("div");
    h.className = "group-title";
    h.id = "g-" + sc;
    h.innerHTML = `${sc} <small>${SIZE_DESC[sc]||""}</small> <span class="group-count">${group.length} 款</span>`;
    main.appendChild(h);
    const g = document.createElement("div");
    g.className = "grid";
    group.forEach(d => g.appendChild(card(d)));
    main.appendChild(g);
  }
}

let lbData = null, lbIndex = 0;
function openLightbox(d, i) {
  lbData = d; lbIndex = i;
  const lb = document.getElementById("lightbox");
  lb.classList.add("show");
  const th = document.getElementById("lb-thumbs");
  th.innerHTML = "";
  (d.views||[]).forEach((v, j) => {
    const t = document.createElement("img");
    t.src = v.url;
    t.referrerPolicy = "no-referrer";
    t.loading = "lazy";
    t.alt = `${v.view}·${v.part}`;
    t.onclick = e => { e.stopPropagation(); setLb(j); };
    th.appendChild(t);
  });
  const many = (d.views||[]).length > 1;
  document.getElementById("lb-prev").style.display = many ? "" : "none";
  document.getElementById("lb-next").style.display = many ? "" : "none";
  th.style.display = many ? "" : "none";
  setLb(i);
}
function setLb(i) {
  const vs = lbData.views || [];
  lbIndex = (i + vs.length) % vs.length;
  const v = vs[lbIndex];
  const im = document.getElementById("lb-img");
  im.referrerPolicy = "no-referrer";
  im.src = v.url;
  const spec = [lbData.height_cm ? lbData.height_cm + "cm" : null, lbData.scale,
    GENDER_CN[lbData.gender], lbData.material].filter(Boolean).join(" · ");
  document.getElementById("lb-cap").textContent =
    `${lbData.brand} · ${lbData.name_cn||lbData.name}(${lbIndex+1}/${vs.length})${spec ? " — " + spec : ""}`;
  const src = document.getElementById("lb-src");
  src.href = lbData.source?.url || "#";
  document.querySelectorAll("#lb-thumbs img").forEach((x,k)=>x.classList.toggle("on",k===lbIndex));
}
const lbEl = document.getElementById("lightbox");
lbEl.onclick = () => lbEl.classList.remove("show");
for (const id of ["lb-img","lb-top","lb-thumbs"])
  document.getElementById(id).onclick = e => e.stopPropagation();
document.getElementById("lb-prev").onclick = e => { e.stopPropagation(); setLb(lbIndex-1); };
document.getElementById("lb-next").onclick = e => { e.stopPropagation(); setLb(lbIndex+1); };
document.addEventListener("keydown", e => {
  if (!lbEl.classList.contains("show")) return;
  if (e.key === "Escape") lbEl.classList.remove("show");
  if (e.key === "ArrowLeft") setLb(lbIndex-1);
  if (e.key === "ArrowRight") setLb(lbIndex+1);
});

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
init();
</script>
